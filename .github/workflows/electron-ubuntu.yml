name: Electron CD Ubuntu

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          components: rustfmt
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "latest"
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
      - name: Use cmake
        run: cmake --version
      - name: Use protoc
        run: protoc --version
      - name: yarn install
        run: |
          yarn install
      - name: Build and Package@Linux
        if: contains(matrix.os, 'ubuntu')
        run: |
          yarn dist:linux
      - name: Name Packages@Linux
        if: contains(matrix.os, 'ubuntu')
        run: |
          mv dist/zingo_pc_${{ env.VERSION }}_amd64.deb dist/Zingo_pc_${{ env.VERSION }}_amd64.deb
      - name: Upload artifacts-deb
        uses: actions/upload-artifact@v4
        if: contains(matrix.os, 'ubuntu')
        with:
          name: ${{ matrix.os }}
          path: dist/Zingo_pc_${{ env.VERSION }}_amd64.deb
      - name: Upload artifacts-AppImage
        uses: actions/upload-artifact@v4
        if: contains(matrix.os, 'ubuntu')
        with:
          name: ${{ matrix.os }}
          path: dist/Zingo-pc-${{ env.VERSION }}.AppImage

