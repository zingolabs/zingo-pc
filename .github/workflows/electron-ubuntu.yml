name: Electron CD Ubuntu

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - name: Context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "latest"
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
      - name: Use cmake
        run: cmake --version
      - name: Use protoc
        run: protoc --version
      - name: yarn --frozen-lockfile
        run: |
          yarn install
      - name: yarn lint
        run: |
          yarn lint
      - name: yarn tsc
        run: |
          yarn tsc
      - name: Build and Package
        run: |
          yarn dist:linux
      - name: Version
        run: |
          ./bin/printversion.sh
      - name: Rename Packages
        run: |
          mv dist/zingo-pc_${{ env.VERSION }}_amd64.deb dist/Zingo.PC-${{ env.VERSION }}-${{ matrix.os }}-amd64.deb
          mv "dist/Zingo PC-${{ env.VERSION }}.AppImage" "dist/Zingo.PC-${{ env.VERSION }}-${{ matrix.os }}.AppImage"
      - name: Upload artifacts-deb
        uses: actions/upload-artifact@v4
        if: contains(matrix.os, 'ubuntu')
        with:
          name: Zingo.PC-${{ env.VERSION }}-${{ matrix.os }}-amd64.deb
          path: dist/Zingo.PC-${{ env.VERSION }}-${{ matrix.os }}-amd64.deb
      - name: Upload artifacts-AppImage
        uses: actions/upload-artifact@v4
        if: contains(matrix.os, 'ubuntu')
        with:
          name: Zingo.PC-${{ env.VERSION }}-${{ matrix.os }}.AppImage
          path: dist/Zingo.PC-${{ env.VERSION }}-${{ matrix.os }}.AppImage

