name: Electron CD

on:
  push:
    tags:
      - 'zingo-pc-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            dist_script: dist:linux

          - runner: macos-15
            platform: mac
            arch: x64
            dist_script: dist:mac-x64
            rust_target: x86_64-apple-darwin

          - runner: macos-14
            platform: mac
            arch: arm64
            dist_script: dist:mac-arm64

          - runner: macos-14
            platform: mas
            arch: universal
            dist_script: dist:mac-mas
            rust_target: x86_64-apple-darwin

          - runner: windows-latest
            platform: win
            arch: x64
            dist_script: dist:win-x64

          - runner: windows-latest
            platform: win
            arch: arm64
            dist_script: dist:win-arm64
            rust_target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: ${{ matrix.rust_target || '' }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "latest"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: yarn install
        run: yarn install

      - name: Decode macOS certificate (DMG)
        if: matrix.platform == 'mac'
        env:
          p12base64: ${{ secrets.p12cert }}
        run: echo "$p12base64" | openssl base64 -d -out cert.p12

      - name: Import macOS certificate (DMG)
        if: matrix.platform == 'mac'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.p12cert }}
          p12-password: ${{ secrets.p12certpassword }}

      - name: Import macOS certificates (MAS)
        if: matrix.platform == 'mas'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.p12certMas }}
          p12-password: ${{ secrets.p12certMasPassword }}
          keychain-password: ${{ secrets.p12certMasPassword }}

      - name: Import macOS installer certificate (MAS)
        if: matrix.platform == 'mas'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.p12certMasInstaller }}
          p12-password: ${{ secrets.p12certMasInstallerPassword }}
          keychain-password: ${{ secrets.p12certMasPassword }}
          create-keychain: false

      - name: Install provisioning profile (MAS)
        if: matrix.platform == 'mas'
        env:
          profile: ${{ secrets.provisioningProfile }}
        run: |
          echo "$profile" | base64 -D -o configs/Zingo_PC_Profile.provisionprofile

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: yarn ${{ matrix.dist_script }}

      - name: Build (macOS)
        if: matrix.platform == 'mac'
        env:
          APPLE_ID: ${{ secrets.appleId }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.appleIdPassword }}
          APPLE_TEAM_ID: ${{ secrets.appleTeamId }}
          LZMA_API_STATIC: 1
        run: yarn ${{ matrix.dist_script }}

      - name: Build (macOS MAS)
        if: matrix.platform == 'mas'
        env:
          LZMA_API_STATIC: 1
          CSC_NAME: "Distheirs LLC (788KRST4S8)"
        run: yarn ${{ matrix.dist_script }}

      - name: Build (Windows)
        if: matrix.platform == 'win'
        run: yarn ${{ matrix.dist_script }}

      - name: Upload artifacts (Linux)
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: zingo-pc-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.AppImage

      - name: Upload artifacts (macOS DMG)
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'mac'
        with:
          name: zingo-pc-mac-${{ matrix.arch }}
          path: dist/*.dmg

      - name: Upload artifacts (macOS MAS)
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'mas'
        with:
          name: zingo-pc-mas-${{ matrix.arch }}
          path: dist/**/*.pkg

      - name: Upload artifacts (Windows)
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'win'
        with:
          name: zingo-pc-win-${{ matrix.arch }}
          path: |
            dist/*.msi
            dist/*.zip

  flatpak:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: zingo-pc-linux-x64
          path: flatpak/

      - name: Add Flathub remote (for Electron BaseApp)
        run: flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Resolve bundle name and patch manifest to use local AppImage
        id: meta
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=$(echo "$TAG" | grep -oP '\d+\.\d+\.\d+')
          APPIMAGE=$(basename flatpak/*.AppImage)
          echo "bundle=Zingo.PC-${VERSION}.flatpak" >> $GITHUB_OUTPUT
          # Replace empty url+sha256 with the local artifact path
          sed -i "s|url:.*|path: ${APPIMAGE}|" flatpak/co.zingo.pc.yml
          sed -i "/sha256:/d" flatpak/co.zingo.pc.yml

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ steps.meta.outputs.bundle }}
          manifest-path: flatpak/co.zingo.pc.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: zingo-pc-flatpak
          path: ${{ steps.meta.outputs.bundle }}

  release:
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Generate release notes
        id: notes
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
            });
            return data.body;
          result-encoding: string

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ${{ steps.notes.outputs.result }}

            ## Zingolabs
            * @Oscar-Pepper @fluidvanadium @AloeareV @idky137 @dorianvp @nachog00 @karentaponte and @zancas making the magic behind the scenes.

            ## Manual Testing
            * Windows & Linux by @edicksonjga.
            * MacOS by @juanky201271
          files: artifacts/**/*
