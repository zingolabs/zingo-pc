name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
      - stable
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "latest"

      - name: Install dependencies
        run: yarn setup

      # The key is not needed to run the tests — nothing here calls SwapKit —
      # but passing it keeps the generated file identical to a real build. On
      # pull requests from forks GitHub withholds secrets, so this resolves to
      # empty and generate-swapkit-secrets.js writes its placeholder, which is
      # what lets a fork's PR compile and test at all.
      - name: Run tests
        env:
          SWAPKIT_API_KEY: ${{ secrets.SWAPKIT_API_KEY }}
        run: yarn test:run

      # The LavaMoat policy is generated from the dependency graph and
      # committed. A build that regenerates it must leave it unchanged.
      - name: LavaMoat policy is up to date
        env:
          SWAPKIT_API_KEY: ${{ secrets.SWAPKIT_API_KEY }}
          LAVAMOAT_GENERATE_POLICY: "1"
        run: yarn script:build && git diff --exit-code -- lavamoat/webpack/policy.json
