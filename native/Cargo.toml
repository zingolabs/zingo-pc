[package]
name = "zingolib-native"
version = "0.1.0"
authors = ["James Katz", "ZL Viridian <zingo@zingolabs.com>"]
license = "ISC"
edition = "2021"
exclude = ["native.node"]

[lib]
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
zingolib = { git="https://github.com/zingolabs/zingolib", rev = "zingolib_v3.0.1" }
pepper-sync = { git="https://github.com/zingolabs/zingolib", rev = "zingolib_v3.0.1" }

zcash_address = { version = "0.10" }
zcash_client_backend = { version = "0.21", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
    "tor",
] }
zcash_encoding = { version = "0.3" }
zcash_keys = { version = "0.12", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_note_encryption = "0.4"
zcash_proofs = { version = "0.26" }
zcash_protocol = { version = "0.7" }
zcash_transparent = { version = "0.6" }

rusqlite = { version = "0.37.0", features = ["bundled"] }

zingo_common_components = { version = "0.2.0", features = ["for_test"] }

bip0039 = { version = "0.13", features = [ "rand" ] }
zip32 = "0.2.0"
json = "0.12"
serde_json = "1"
hex = "0.4"
http = "1"
tokio = "1"
rustls = { version = "0.23", features = ["ring"] }
thiserror = "2"
log = "0.4"

once_cell = "1"
lazy_static = "1.4.0"

[dependencies.neon]
version = "1"
default-features = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Security_Credentials_UI"] }

[profile.release]
debug = 1