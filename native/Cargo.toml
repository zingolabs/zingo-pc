[package]
name = "zingolib-native"
version = "0.1.0"
authors = ["James Katz", "ZL Viridian <zingo@zingolabs.com>"]
license = "ISC"
edition = "2021"
exclude = ["native.node"]

[lib]
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
zingolib = { git="https://github.com/zingolabs/zingolib", default-features=true, tag = "2.0.2"}
pepper-sync = { git = "https://github.com/zingolabs/zingolib", tag = "2.0.2" }

zcash_primitives = "0.22.0"
zcash_keys = { version = "0.8.0" , features = ["transparent-inputs", "sapling", "orchard" ] }
zcash_address = "0.7.0"
zcash_protocol = "=0.5.1"
zcash_client_backend = { version = "0.18.0" , features = ["lightwalletd-tonic", "orchard", "transparent-inputs", "tor"] }

# Zingolabs
zingo-infra-services = { git = "https://github.com/zingolabs/infrastructure.git", branch = "dev" }

bip0039 = { version = "0.12", features = [ "rand" ] }
json = "0.12.4"
serde_json = "1"
hex = "0.4"
http = "1.1.0"
lazy_static = "1.4.0"
tokio = { version = "1.24", features = ["full"] }
rustls = { version = "0.23.13", features = ["ring"] }

[dependencies.neon]
version = "1"
default-features = true
