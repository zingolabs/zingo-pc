[package]
name = "zingolib-native"
version = "0.1.0"
authors = ["James Katz", "ZL Viridian <zingo@zingolabs.com>"]
license = "ISC"
edition = "2021"
exclude = ["native.node"]

[lib]
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Ironwood (NU6.3). Versions match the zingolib lockfile at the commit this
# resolves to: mostly published crates.io zcash crates, plus a few from
# librustzcash git (zcash_pool_migration, zcash_primitives 0.30) that the branch
# needs, pinned in Cargo.lock (see the [patch] note below). Ground truth = that
# Cargo.lock, not zingo-mobile's manifest. Build with `yarn neon` (needs
# `protoc` on PATH).
#
# History of the previous dev pin, kept because the constraints it records
# still hold: fix/for-zingo-pc-working (the boundary-carrier serde mint on
# MixnetStatus + the Nym surface) merged via PR #2610, so dev now carries
# attach_mixnet, the five-state Mixnet Mode, the MixnetStatus wire (with its
# follow-up mode-scoping-on-lift hardening), the treestate fix, and the private
# ironwood migration. Price is mixnet-only: update_current_price is
# #[cfg(feature="nym")] and returns MixnetPriceFetch with no clearnet tier, so
# zec_price_over_mixnet reads its .usd. The critical rc.1 lockfile crates match
# (zcash_client_backend 0.24.0-rc.1, crypto-common rc.1, zcash_primitives 0.29
# crates.io + 0.30 git coexist, orchard 0.15.4). See the [patch] note below on
# the librustzcash rev pin zcash_pool_migration requires.
#
# The OP_RETURN work (zingolib PR #2469) has landed on dev, so the fork pin is
# gone and these follow zingolabs/zingolib. By rev rather than by branch, so a
# build stays reproducible (ADR 0024 rule 7); bump it deliberately.
#
# dev renamed the surface swaps depend on: OpReturnData moved to
# wallet::transparent, and the one-step propose_swap_deposit became
# propose_send_with_op_return, which stores a proposal that
# send_stored_proposal then transmits, resuming at the OP_RETURN step when the
# deshield already went out. The native layer was adapted to that shape
# alongside this bump.
#
# `perspective` is the editorial layer (value transfers, messages, the
# total_*_to_address reductions), behind a default-off feature, so the UI's
# read model has to opt in.
#
# This bump (3fdd4e66 -> ec4547c8) splits the send route from the price route.
# Transmissions now follow a per-session `mixnet::TransmitPolicy` instead of
# the transport's own switched-off state, and `disable_mixnet` deliberately
# leaves that policy alone. Since a session starts under `Mixnet`, the native
# `stop_mixnet` sets the policy to `Clearnet` itself — without it, switching
# Mixnet Mode off would leave every send refusing as "the Nym mixnet is not
# enabled", which is the opposite of what this app's off switch means.
#
# The price fetch went the other way: it is mixnet-only in every state now,
# switched-off included, so with Mixnet Mode off there is no ZEC price at all.
# The dashboard says so rather than showing dashes that look like a hung fetch.
#
# Also gone: `PriceFetchRoute::Clearnet` and `LightClientError::ProbeRequiresMixnet`,
# neither of which this crate named.
#
# This bump (7a542ce4 -> af40a1f3) crosses two things. Sync is continuous
# (zingolib ADR 0051): the engine stays at the tip instead of returning, and
# `SyncConfig` gains `shutdown_on_completion`, which this crate sets to false.
# The wallet file is version 44, so a wallet opened with this build is refused
# by one without it. And the indexer channel bounds the connection it makes,
# including the TLS handshake, so a reconnect over a path that has gone silent
# fails instead of waiting for good (zingolib #2775, this crate's report).
#
# `max_send_value` lost its Zennies argument with the send-all rework, and
# `sync::sync_status` is no longer re-exported: `LightClient::latest_sync_status`
# is the published status, and pepper-sync's own function the computed one.
#
# This bump (af40a1f3 -> 0838ea8c) closes what continuous sync left open in
# the migration flows. They used to sync with `sync_and_await`, which under
# a wallet that never shuts its engine down does not return: the call this
# crate makes under the exclusive client lock would have waited for good,
# with every other endpoint behind it. They now use `sync_to_tip_and_await`,
# which overrides `shutdown_on_completion` for that one session, stops any
# running engine first and leaves it stopped — the five-second cycle this
# crate restores after a migration launches the next one (zingolib #2781,
# raised from here). Nothing else in the surface this crate names changed.
#
# This bump (0838ea8c -> c895abc6) is what continuous sync left open in the
# transparent half. Outpoints were mapped for every block scanned rather than
# for the ones the session could be spending against, so the map — and the
# wallet file — grew without bound. A `transparent_scan_floor` now bounds it:
# below the session's starting chain height the transparent data of compact
# blocks is left alone, because address discovery already covered it, and
# above it is scanned.
#
# The half of that we met in the field is the other one: address discovery now
# runs at the start of every session, not only when blocks were mined. A
# transparent payment received DURING a session lands in a block that the
# session's own discovery pass (which ran before it) never covered, and that
# the next session's pass will not cover either, since it starts from the last
# known chain height. A swap refund arrived that way and sat in the wallet as
# `Mempool` while the chain moved on past it, on its way to being expired as
# failed for funds that were on chain the whole time.
#
# This bump (c895abc6 -> b38bbcbb) is zingolib #2786, which closes the report
# this crate made: a wallet that could not compute the Ironwood tree root and
# only a rescan would mend (#2782). Two faults behind it. A pool rescan
# compared its pools the wrong way round, so rescanning Ironwood cleared the
# Sapling and Orchard trees and left Ironwood's own untouched — the tree that
# was supposed to be rebuilt. And the subtree roots were fetched behind a
# new-block check, so a session that started at the tip inserted note
# commitments before fetching the roots the lower shards needed.
#
# A server that does not serve a pool is now an error rather than something
# sync carries on past: failing to fetch the Ironwood subtree roots fails the
# sync, an omitted tree state answers `TreeStateNotServed`, and a reported
# tree size of zero against a calculated one answers `TreeSizeNotReported`.
# All three recommend `ServerUnavailable`, and the remedy is a different
# server. Of the servers in the published registry this app draws from, two
# would now refuse: `lwd.bunny-zec.xyz` serves no Ironwood at all and
# `zaino.unsafe.zec.rocks` serves the tree state but refuses the roots
# (measured with `cargo run --example ironwood_probe`).
#
# This bump (b38bbcbb -> 51e5d7a0) is the other half of what the wallet could
# not see. A compact block request names the pools it wants, and pepper-sync
# named none, so the blocks it scanned carried no transparent data at all —
# which is why a payment to a t-address of an open wallet was never found by
# the session it arrived in, sat as `Mempool` while the chain moved past it,
# and was eventually marked failed for funds that were on chain the whole
# time (zingolib #2794, closing this crate's report #2785). Transparent data
# is now asked for, and only for the blocks above the session's transparent
# scan floor, which are the ones it is scanned in.
#
# With it comes one more refusal: a server whose lightwallet protocol version
# is below v0.5.0, or absent, has its sync refused at the start of the
# session, because that is the version where transparent data in compact
# blocks and the Ironwood pool arrived. Every server this app draws from
# reports exactly v0.5.0; `lwd.bunny-zec.xyz`, on v0.4.19, reports none. Like
# the other server refusals it recommends `ServerUnavailable`, which this
# crate now acts on.
#
# This bump (51e5d7a0 -> 12f30ade) is bandwidth rather than correctness. A
# range whose nullifiers were dropped for want of map space could be picked
# for re-fetching while a lower range was still being scanned, and the
# nullifiers it fetched were then discarded again, because every range below
# must be scanned before a re-fetch proves anything (zingolib #2797). It
# needs the map to fill in the first place, which at this app's default
# performance level takes two million nullifiers, so it is the wallets set to
# Low or Medium by hand, and long rescans, that were paying for it. Also in
# the range: the first test of the nullifier re-fetch path (#2795).
#
# This bump (12f30ade -> 784e6b8b) answers the two faults this crate
# reported from a day of using it.
#
# A transaction that spends the wallet's transparent coins and pays
# everything away is fetched and confirmed when the spend is detected
# (zingolib #2805, closing #2798). It used to sit at `Mempool` until it
# expired as failed — and the expiry reset its spent coins to unspent, so a
# swap deposit's second leg was wrong in the history and in the balance at
# once. Only a rescan mended it.
#
# And a request that failed to network weather is recommended
# `MaybeRecoverableServer` again rather than `ServerUnavailable` (#2804,
# closing #2799): the status's source chain is read for a transport error, a
# client-side timeout or an I/O error, and failing that the gRPC code
# decides. What the recommendation now asks of a consumer is a bounded
# number of retries before it treats the server as unavailable, because one
# error cannot tell passing weather from a server that fails the same way
# every time.
#
# And with it (#2807) the third transparent blind spot of the week: a scan
# returned the whole set of gap addresses and the scanner adopted it, so a
# nullifier re-fetch — which reads no transparent data and returned an empty
# set — left the session watching no gap address at all. Scans now return
# only what changed.
#
# This bump (925f9ca2 -> 44a3741e) writes wallet file version 45, and the
# wallet it writes is refused by a build before this one. The last of the
# transparent blind spots goes with it: the scan floor is persisted, so the
# next session's address discovery starts from the floor the previous one
# left rather than from the re-org allowance alone. The blocks mined while a
# session was stopped were covered by neither — and this crate stops the
# engine for every spend, so that window opens on every send, swap deposit
# and shield (zingolib #2809).
#
# From 45 the embedded types refuse a serialized version above the one they
# write. Before it they read any version as their own, which is why 44 and 45
# were each minted for an embedded change — and why a wallet written here
# and opened by an older build is misread rather than refused.
#
# This bump (44a3741e -> 63998665) is two fixes to the engine under a re-org
# and under a pause, and the release versions of the librustzcash crates.
#
# Scan results of a range a re-org truncated or re-prioritised while it was
# being scanned are discarded, and what the wallet still holds of the range is
# scanned again (zingolib #2837). A server reporting a chain height below the
# wallet's, with a scan of the tip in flight, truncated the range and then
# panicked on the results.
#
# And a sync with `shutdown_on_completion` set no longer overwrites a pause
# with its own shutdown (#2840). This crate runs continuous sync, where that
# setting is off, so it is here for the migration paths that sync to the tip.
zingolib = { git = "https://github.com/zingolabs/zingolib", rev = "6399866557ddf6a39f8a8cb5684c071db8a62fbc", features = ["nym", "perspective"] }
pepper-sync = { git = "https://github.com/zingolabs/zingolib", rev = "6399866557ddf6a39f8a8cb5684c071db8a62fbc" }
zingo-netutils = { git = "https://github.com/zingolabs/zingolib", rev = "6399866557ddf6a39f8a8cb5684c071db8a62fbc" }

# These must match zingolib's workspace versions exactly, not merely be
# semver-compatible with them. Two versions of `zcash_keys` resolve to two
# distinct `UnifiedFullViewingKey` types with the same path, and zingolib's
# `TryFrom<&UnifiedKeyStore>` impl only targets its own — the compiler then
# reports a missing trait impl that looks nothing like a version mismatch.
#
# The 0.29/0.30 `zcash_primitives` split that forced the old rc.1 pin is gone:
# the branch dropped the librustzcash git dependency and now takes every one of
# these from crates.io. When bumping the zingolib rev, read its workspace
# Cargo.toml and copy the numbers across.
zcash_address = "0.13"
zcash_client_backend = { version = "0.24.0", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
] }
zcash_encoding = "0.4"
zcash_keys = { version = "0.16.1", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_note_encryption = "0.4.2"
zcash_proofs = "0.30"
zcash_protocol = "0.10"
zcash_transparent = "0.10"

rusqlite = { version = "0.37.0", features = ["bundled"] }

zingo_common_components = "0.4.0"

bip0039 = { version = "0.14", features = [ "rand" ] }
zip32 = "0.2.0"
json = "0.12"
serde_json = "1"
hex = "0.4"
http = "1"
tokio = "1"

# zingo-price fetches the ZEC price over HTTPS with reqwest built as
# `rustls-tls-no-provider`, which resolves to `rustls-tls-manual-roots` — an
# EMPTY root-certificate store. It relies on some other crate in the build
# enabling a reqwest roots feature (cargo unifies reqwest features across the
# whole graph). Nothing else in zingo-pc's native build does, so the Gemini
# request fails with no trust anchors. We enable webpki (Mozilla) roots here.
# The `-no-provider` variant is required: the plain `rustls-tls-webpki-roots`
# also pulls in the `ring` provider, which the ironwood workspace excised.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider"] }
thiserror = "2"
log = "0.4"

once_cell = "1"
lazy_static = "1.4.0"

# Force static linking of liblzma so the MAS sandbox cannot block Homebrew's
# /opt/homebrew/opt/xz/lib/liblzma.5.dylib at runtime (sandbox error 159).
liblzma = { version = "0.4", features = ["static"] }

[dependencies.neon]
version = "1"
default-features = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Security_Credentials_UI"] }

[build-dependencies]
cc = "1"

# Only the patches zingolib's workspace applies: a dependency's own [patch]
# table is ignored by cargo, so they are replicated here. lightwallet-protocol
# carries the Ironwood proto fields (its `rebuild-proto` feature needs
# `protoc` on PATH).
[patch.crates-io]
lightwallet-protocol = { git = "https://github.com/zingolabs/lightwallet-protocol-rust", rev = "9bdfdc77eb283f2a3d26c27100cc2ac90148cd93" }

[profile.release]
debug = 1
# panic strategy: intentionally left at the default ("unwind").
#
# Switching to `panic = "abort"` would shrink the MAS binary slightly and is
# tempting from a security-hardening angle, but it is incompatible with the
# `with_panic_guard` infrastructure used throughout this crate. That guard
# wraps every FFI entry point in `panic::catch_unwind`, converting transient
# panics (zingolib internal bugs, lock poisoning, etc.) into a recoverable
# `ZingolibError::Panic` returned to JS. With `abort`, those panics would
# instead terminate the wallet process. The unwind/resilience trade-off was
# made deliberately at the architecture level — do not flip this flag without
# first removing `with_panic_guard` everywhere and propagating errors via
# `Result` only.
