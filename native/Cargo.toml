[package]
name = "zingolib-native"
version = "0.1.0"
authors = ["James Katz", "ZL Viridian <zingo@zingolabs.com>"]
license = "ISC"
edition = "2021"
exclude = ["native.node"]

[lib]
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Ironwood (NU6.3). Versions match the zingolib feat/ironwood lockfile at the
# commit this resolves to (currently c6987da): it uses the PUBLISHED crates.io
# zcash crates (no librustzcash/zebra git-rev patches — those belong to an older
# feat/ironwood commit that zingo-mobile pins). Ground truth = that Cargo.lock,
# not zingo-mobile's manifest. Build with `yarn neon` (needs `protoc` on PATH).
# Pinned to 79d575bf — the exact zingolib commit zingo-mobile's latest build uses
# (dev, #2548 fix/restore-price). It restores the CLEARNET price tier so the
# mainnet USD price works again (7ac32fa gated the price fetch behind the Nym
# mixnet only). It DOES carry ADR 0018 (anchors drawn at age >=1), which strands
# the scheduled/private path's first batch (MissedBoundary) — but that path is
# disabled behind "Coming soon" in the UI, so it never runs; only the immediate
# (happy) path and the price matter here, and the immediate path is unaffected
# (ADR 0018 is scoped to Phase 2). Migration section is v4 (reads our v3 wallets;
# do not downgrade past this). Adapt the private path when its upstream
# current-bucket placement is fixed and Nym lands.
zingolib = { git="https://github.com/zingolabs/zingolib", rev = "79d575bf99612ac93fb4986bdc1e6d8f398c05ac" }
pepper-sync = { git="https://github.com/zingolabs/zingolib", rev = "79d575bf99612ac93fb4986bdc1e6d8f398c05ac" }
zingo-netutils = { git="https://github.com/zingolabs/zingolib", rev = "79d575bf99612ac93fb4986bdc1e6d8f398c05ac" }

zcash_address = "0.13"
# Keep at rc.1 (matches zingolib@79d575bf's lockfile). rc.4 pulls zcash_primitives
# 0.30 from crates.io, which collides with pepper-sync's 0.29 (HashSer mismatch) —
# so after any full `cargo update`, re-pin with `cargo update -p zcash_client_backend
# --precise 0.24.0-rc.1` (and orchard must stay >=0.15.4 for the Ironwood builder).
zcash_client_backend = { version = "0.24.0-rc.1", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
] }
zcash_encoding = "0.4"
zcash_keys = { version = "0.15", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_note_encryption = "0.4.2"
zcash_proofs = "0.29"
zcash_protocol = "0.10"
zcash_transparent = "0.9"

rusqlite = { version = "0.37.0", features = ["bundled"] }

zingo_common_components = "0.4.0"

bip0039 = { version = "0.14", features = [ "rand" ] }
zip32 = "0.2.0"
json = "0.12"
serde_json = "1"
hex = "0.4"
http = "1"
tokio = "1"
# aws_lc_rs, not ring: the zingolib feat/ironwood workspace excised ring and
# uses aws-lc-rs as its sole rustls CryptoProvider (with prefer-post-quantum).
# zingo-netutils (sync) and zingo-price (Gemini fetch) both install aws-lc-rs;
# we must install the same default or the price handshake fails. See lib.rs.
rustls = { version = "0.23", features = ["aws_lc_rs"] }

# zingo-price fetches the ZEC price over HTTPS with reqwest built as
# `rustls-tls-no-provider`, which resolves to `rustls-tls-manual-roots` — an
# EMPTY root-certificate store. It relies on some other crate in the build
# enabling a reqwest roots feature (cargo unifies reqwest features across the
# whole graph). Nothing else in zingo-pc's native build does, so the Gemini
# request fails with no trust anchors. We enable webpki (Mozilla) roots here.
# The `-no-provider` variant is required: the plain `rustls-tls-webpki-roots`
# also pulls in the `ring` provider, which the ironwood workspace excised.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider"] }
thiserror = "2"
log = "0.4"

once_cell = "1"
lazy_static = "1.4.0"

# Force static linking of liblzma so the MAS sandbox cannot block Homebrew's
# /opt/homebrew/opt/xz/lib/liblzma.5.dylib at runtime (sandbox error 159).
liblzma = { version = "0.4", features = ["static"] }

[dependencies.neon]
version = "1"
default-features = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Security_Credentials_UI"] }

[build-dependencies]
cc = "1"

# Only the patches the zingolib feat/ironwood workspace actually needs at this
# commit (per its Cargo.lock): a dependency's own [patch] table is ignored by
# cargo, so these two must be replicated here. lightwallet-protocol carries the
# Ironwood proto fields (its `rebuild-proto` feature needs `protoc` on PATH).
# NO librustzcash/zebra git-rev patches — this commit uses published crates.io
# zcash crates; adding them (as zingo-mobile does for an older commit) would
# force the wrong versions.
[patch.crates-io]
time = { git = "https://github.com/time-rs/time", tag = "v0.3.47" }
lightwallet-protocol = { git = "https://github.com/zingolabs/lightwallet-protocol-rust", rev = "9bdfdc77eb283f2a3d26c27100cc2ac90148cd93" }

[profile.release]
debug = 1
# panic strategy: intentionally left at the default ("unwind").
#
# Switching to `panic = "abort"` would shrink the MAS binary slightly and is
# tempting from a security-hardening angle, but it is incompatible with the
# `with_panic_guard` infrastructure used throughout this crate. That guard
# wraps every FFI entry point in `panic::catch_unwind`, converting transient
# panics (zingolib internal bugs, lock poisoning, etc.) into a recoverable
# `ZingolibError::Panic` returned to JS. With `abort`, those panics would
# instead terminate the wallet process. The unwind/resilience trade-off was
# made deliberately at the architecture level — do not flip this flag without
# first removing `with_panic_guard` everywhere and propagating errors via
# `Result` only.