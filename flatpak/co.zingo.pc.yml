app-id: co.zingo.pc
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: zingo-pc
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.freedesktop.Notifications
  - --env=ELECTRON_IS_DEV=0
  - --env=ELECTRON_FORCE_IS_PACKAGED=true

modules:
  - name: zingo-pc
    buildsystem: simple
    build-commands:
      # Extract AppImage (no FUSE needed, uses unsquashfs internally)
      - chmod +x zingo-pc.AppImage
      - ./zingo-pc.AppImage --appimage-extract

      # electron-builder AppImages keep the binary + Electron libs + app.asar at
      # the squashfs root (not under usr/lib). Copy everything there.
      - install -d /app/lib/zingo-pc
      - cp -a squashfs-root/. /app/lib/zingo-pc/

      # Drop AppRun — we launch via zypak-wrapper instead.
      - rm -f /app/lib/zingo-pc/AppRun

      # chrome-sandbox is setuid in AppImages; Flatpak/zypak handles sandboxing
      # so strip the setuid bit to avoid Flatpak build errors.
      - chmod u-s /app/lib/zingo-pc/chrome-sandbox || true

      # Diagnostic: probe every .so individually so we ONLY see noise from our
      # libs (not the system ones). When a file makes ldconfig return non-zero,
      # we print "FAILED: <file>" + the actual stderr message.
      - |
        echo "=== ldconfig diagnostic on /app/lib/zingo-pc ==="
        for f in /app/lib/zingo-pc/*.so /app/lib/zingo-pc/*.so.[0-9]*; do
          [ -e "$f" ] || continue
          out=$(ldconfig -N -v "$f" 2>&1 1>/dev/null) || rc=$?
          if [ -n "$out" ] || [ "${rc:-0}" -ne 0 ]; then
            echo "PROBLEM: $f"
            [ -n "$out" ] && echo "  stderr: $out"
            [ "${rc:-0}" -ne 0 ] && echo "  exit: ${rc}"
          fi
          rc=0
        done
        echo "=== end ldconfig diagnostic ==="

      # Wrapper script that uses zypak to handle Chrome sandbox inside Flatpak
      - install -Dm755 zingo-pc-wrapper.sh /app/bin/zingo-pc

      # Desktop file is named after the binary in electron-builder output;
      # install it under the appId-based filename Flathub requires.
      # Also point Icon= at the appId-based icon name so AppStream resolves it.
      - install -Dm644 squashfs-root/zingo-pc.desktop /app/share/applications/co.zingo.pc.desktop
      - desktop-file-edit --set-key=Exec --set-value='zingo-pc %U' /app/share/applications/co.zingo.pc.desktop
      - desktop-file-edit --set-icon=co.zingo.pc /app/share/applications/co.zingo.pc.desktop

      # App icon
      - install -Dm644 squashfs-root/zingo-pc.png /app/share/icons/hicolor/512x512/apps/co.zingo.pc.png

      # AppStream metadata (required by Flathub)
      - install -Dm644 co.zingo.pc.metainfo.xml /app/share/metainfo/co.zingo.pc.metainfo.xml

    sources:
      # Pre-built AppImage — url and sha256 are patched by CI at build time
      - type: file
        url: ""
        sha256: ""
        dest-filename: zingo-pc.AppImage

      - type: file
        path: zingo-pc-wrapper.sh

      - type: file
        path: co.zingo.pc.metainfo.xml
